<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../assets/icons/todo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/todo-192.png">
<meta name="theme-color" content="#ffffff">
<title>Todo</title>
<style>
  /* DA « brute old school » du site : Times, traits noirs 1 px, boutons gris en relief, icônes pixel.
     Page autonome : aucun lien obligatoire avec le reste du site. */
  :root{color-scheme:light;--bg:#fff;--fg:#000;--mut:#555;--line:#000;--soft:#999;--acc:#0000ee;--vis:#551a8b;
    --hover:#ffffcc;--btn:#e0e0e0;--content-font-size:18px}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 "Times New Roman",Times,serif}
  a{color:var(--acc);text-decoration:underline}
  a:visited{color:var(--vis)}
  code{font-family:"Courier New",Courier,monospace}
  .wrap{max-width:880px;margin:0 auto;padding:40px 16px 48px}
  h1{font-size:28px;margin:0 0 16px;display:flex;align-items:center}
  .i{image-rendering:pixelated;vertical-align:middle;flex:none;border:0}
  .i32{margin-right:8px}
  .i16{image-rendering:auto}

  /* Barres d'outils */
  .bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 8px}
  .bar .grow{flex:1}
  .vsep{width:0;height:22px;border-left:1px solid var(--soft);margin:0 4px}
  button{font:13px Arial,Helvetica,sans-serif;padding:3px 8px;min-height:28px;border:2px outset #ddd;background:var(--btn);
    color:#000;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
  button:active{border-style:inset}
  button[hidden]{display:none}
  button:focus-visible{outline:1px dotted #000;outline-offset:-5px}
  #decreaseFontBtn,#increaseFontBtn,#fontSpaceBtn{font-family:"Times New Roman",Times,serif;font-weight:bold;min-width:30px;justify-content:center}
  #decreaseFontBtn{font-size:12px}
  #increaseFontBtn{font-size:17px}
  #fontSpaceBtn{font-family:"Courier New",Courier,monospace;font-size:13px}
  label.lb{font-weight:bold}
  #listSelect,#newTaskInput,.task-edit-input,.modal input,input[type=date],.task-edit-row select{font:inherit;border:2px inset #ccc;
    background:#fff;color:var(--fg);border-radius:0;padding:3px 6px}
  #listSelect{font-size:16px;min-height:28px;max-width:55vw}
  #newTaskForm{display:flex;gap:6px;margin:0 0 8px}
  #newTaskForm[hidden]{display:none}
  #newTaskInput{flex:1;min-width:0;font-size:var(--content-font-size)}
  input[type=date]{font-size:14px;min-height:28px}

  /* Bandeau des échéances : encadré noir, comme les avertissements du site */
  #dueBanner{display:flex;align-items:center;gap:6px;margin:0 0 8px;padding:4px 8px;border:1px solid var(--line);cursor:pointer;
    font-weight:bold}
  #dueBanner[hidden],#conflictBar[hidden]{display:none}
  #dueBanner:hover{background:var(--hover)}
  #conflictBar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 8px;padding:4px 8px;border:2px solid #c00000}
  #conflictBar span{flex:1;min-width:200px}

  /* Liste : simple encadré, comme les listes du site */
  #taskList{list-style:none;margin:0;padding:0;border:1px solid var(--line);font-size:var(--content-font-size)}
  #taskList[hidden]{display:none}
  .task-item{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;padding:4px 8px;border-top:1px solid var(--soft)}
  .task-item:first-child{border-top:0}
  .task-item:hover{background:var(--hover)}
  .task-checkbox{appearance:none;-webkit-appearance:none;flex:none;width:16px;height:16px;margin:0;border:2px inset #ccc;
    background:#fff;cursor:pointer;display:grid;place-items:center}
  .task-checkbox:checked::after{content:"✓";font:bold 13px/1 Arial,sans-serif;color:#000}
  .task-checkbox:focus-visible{outline:1px dotted #000;outline-offset:1px}
  .task-text{flex:1 1 9em;min-width:0;cursor:text;padding:2px 4px;overflow-wrap:anywhere}
  .task-text:focus{outline:1px dotted #000}
  .task-item.done .task-text{text-decoration:line-through;color:var(--mut)}
  .task-edit-input{flex:1;min-width:0;font-size:var(--content-font-size)}
  .task-delete{flex:none;min-height:0;padding:1px;border:0;background:none;opacity:.35}
  .task-item:hover .task-delete,.task-delete:focus-visible{opacity:1}
  .task-prio{flex:none;font-weight:bold;color:#c00000}
  .task-list-name,.due{flex:none;font:13px "Courier New",Courier,monospace;white-space:nowrap}
  .task-list-name{color:var(--mut);max-width:40%;overflow:hidden;text-overflow:ellipsis}
  .due{border:1px solid var(--soft);padding:0 4px}
  .due.soon{border-color:var(--line);font-weight:bold}
  .due.today{background:#ffd800;color:#000;border-color:#000;font-weight:bold}
  .due.late{background:#c00000;color:#fff;border-color:#c00000;font-weight:bold}
  .task-item.done .due{background:none;color:var(--mut);border-color:var(--soft);font-weight:normal}
  .group-head{padding:2px 8px;border-top:1px solid var(--line);background:var(--btn);font-weight:bold;font-size:15px}
  .group-head:first-child{border-top:0}
  .task-edit-row{flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .task-edit-row .task-edit-input{flex:1 1 220px}
  .task-edit-row label{display:inline-flex;align-items:center;gap:3px;font-size:14px;white-space:nowrap}
  .task-edit-row select{font-size:14px;min-height:28px;max-width:100%}
  #emptyState{margin:0;padding:40px 16px;border:1px solid var(--line);text-align:center;color:var(--mut);font-style:italic}

  /* Ligne d'état */
  .status-line{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--mut);font:13px "Courier New",Courier,monospace}
  #status{display:flex;align-items:center;gap:6px}
  #statusDot{width:9px;height:9px;flex:none;background:#808080;border:1px solid #000}
  #status.synced #statusDot{background:#00a000}
  #status.pending #statusDot,#status.saving #statusDot,#status.loading #statusDot{background:#e0a000}
  #status.error #statusDot{background:#d00000}
  .status-line .grow{flex:1}

  .monospace-mode #taskList,.monospace-mode #newTaskInput,.monospace-mode .task-edit-input{
    font-family:"Courier New",Courier,monospace}

  /* Boîte de connexion : encadré noir, ombre dure (comme l'aperçu des PDF du site) */
  .backdrop{position:fixed;inset:0;z-index:1000;background:rgba(255,255,255,.7);display:none}
  .modal{position:fixed;z-index:1001;display:none;top:50%;left:50%;transform:translate(-50%,-50%);width:min(440px,92vw);
    background:var(--bg);border:1px solid var(--line);padding:14px 16px;box-shadow:4px 4px 0 var(--line)}
  .modal h3{margin:0 0 10px;font-size:20px;padding-bottom:2px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
  .modal input{width:100%;margin:6px 0 8px;font-family:"Courier New",Courier,monospace;font-size:14px}
  .modal .row{display:flex;justify-content:flex-end;gap:6px;margin-top:10px}
  .modal p.hint{margin:4px 0 0;color:var(--mut);font-size:14px}
  .modal p.error{margin:4px 0 0;color:#c00000;font-size:14px}

  /* Mode sombre : noir et jaune, contraste élevé */
  body.dark-mode{--bg:#000;--fg:#ffff8c;--mut:#bdbd6a;--line:#ffff8c;--soft:#555;--acc:#7fb2ff;--vis:#c69cff;--hover:#202000}
  body.dark-mode button{background:#000;color:#ffff8c;border:1px solid #ffff8c}
  body.dark-mode #listSelect,body.dark-mode #newTaskInput,body.dark-mode .task-edit-input,body.dark-mode .modal input,
  body.dark-mode .task-checkbox,body.dark-mode input[type=date],body.dark-mode .task-edit-row select{background:#000;
    border:1px solid #ffff8c;color:#ffff8c;color-scheme:dark}
  body.dark-mode .group-head{background:#202000}
  body.dark-mode .task-prio{color:#ff6060}
  body.dark-mode .task-checkbox:checked::after{color:#ffff8c}
  body.dark-mode .backdrop{background:rgba(0,0,0,.7)}

  @media (max-width:640px){
    .wrap{padding:16px 8px 32px}
    h1{font-size:22px}
    .lbl{display:none}            /* boutons : icône seule */
    .vsep,.status-line .hint{display:none}
    #listSelect{max-width:none;flex:1}
    #newTaskForm{flex-wrap:wrap}
    #newTaskInput{flex:1 1 100%}
    #newTaskDate{flex:1}
  }
</style>
</head>
<body>
<div class="wrap">
<h1><img class="i i32" src="../assets/icons/todo.png" alt="" width="32" height="32">Todo</h1>

<div class="backdrop" id="modalBackdrop"></div>

<div class="modal" id="settingsModal" role="dialog" aria-labelledby="settingsTitle">
  <h3 id="settingsTitle"><img class="i i16" src="../assets/icons/connexion.png" alt="" width="16" height="16">Synchronisation GitHub</h3>
  <label for="tokenInput">Token GitHub (scope <code>gist</code> uniquement) :</label>
  <input type="password" id="tokenInput" placeholder="ghp_..." autocomplete="off">
  <p class="hint" id="gistLink"></p>
  <p class="error" id="settingsError" style="display:none"></p>
  <div class="row">
    <button type="button" id="tokenSaveBtn">Connecter</button>
    <button type="button" id="tokenClearBtn">Déconnecter</button>
    <button type="button" id="settingsCloseBtn">Fermer</button>
  </div>
</div>

<div id="toolbar" class="bar" role="toolbar" aria-label="Barre d'outils">
  <button type="button" id="openBtn" title="Importer un .txt"><img class="i i16" src="../assets/icons/dossier-ouvert.png" alt="" width="16" height="16"><span class="lbl">Ouvrir</span></button>
  <button type="button" id="exportBtn" title="Exporter en .txt"><img class="i i16" src="../assets/icons/disquette.png" alt="" width="16" height="16"><span class="lbl">Exporter</span></button>
  <button type="button" id="clearBtn" title="Vider la liste courante"><img class="i i16" src="../assets/icons/vider.png" alt="" width="16" height="16"><span class="lbl">Vider</span></button>
  <span class="vsep"></span>
  <button type="button" id="decreaseFontBtn" title="Réduire la police">A−</button>
  <button type="button" id="increaseFontBtn" title="Agrandir la police">A+</button>
  <button type="button" id="fontSpaceBtn" title="Police proportionnelle / à chasse fixe">P/M</button>
  <button type="button" id="darkModeToggle" title="Mode sombre"><img class="i i16" src="../assets/icons/theme.png" alt="" width="16" height="16"><span class="lbl">Sombre</span></button>
  <span class="grow"></span>
  <button type="button" id="reloadBtn" title="Recharger depuis le gist"><img class="i i16" src="../assets/icons/synchro.png" alt="" width="16" height="16"><span class="lbl">Recharger</span></button>
  <button type="button" id="settingsBtn" title="Connexion GitHub"><img class="i i16" src="../assets/icons/connexion.png" alt="" width="16" height="16"><span class="lbl">Connexion</span></button>
</div>

<div id="listBar" class="bar" role="toolbar" aria-label="Gestion des listes">
  <label class="lb lbl" for="listSelect">Liste :</label>
  <select id="listSelect"></select>
  <button type="button" id="addListBtn" title="Nouvelle liste"><img class="i i16" src="../assets/icons/nouvelle-liste.png" alt="" width="16" height="16"><span class="lbl">Nouvelle</span></button>
  <button type="button" id="renameListBtn" title="Renommer la liste"><img class="i i16" src="../assets/icons/renommer.png" alt="" width="16" height="16"><span class="lbl">Renommer</span></button>
  <button type="button" id="deleteListBtn" title="Supprimer la liste"><img class="i i16" src="../assets/icons/supprimer.png" alt="" width="16" height="16"><span class="lbl">Supprimer</span></button>
  <button type="button" id="setupListsBtn" title="Créer les listes conseillées (Boîte de réception, Ordi, Enfants & santé…)" hidden><img class="i i16" src="../assets/icons/dossier.png" alt="" width="16" height="16"><span class="lbl">Listes conseillées</span></button>
</div>

<div id="dueBanner" role="button" tabindex="0" title="Voir les échéances" hidden><img class="i i16" src="../assets/icons/a-venir.png" alt="" width="16" height="16"><span id="dueBannerText"></span></div>

<div id="conflictBar" role="alert" hidden>
  <span>La todo a été modifiée sur un autre appareil pendant que celui-ci avait des changements non envoyés.</span>
  <button type="button" id="conflictKeepBtn" title="Envoyer la version de cet appareil (écrase l'autre)">Garder celle-ci</button>
  <button type="button" id="conflictTakeBtn" title="Recharger l'autre version (perd les changements d'ici)">Prendre l'autre</button>
</div>

<form id="newTaskForm" autocomplete="off">
  <input type="text" id="newTaskInput" placeholder="Nouvelle tâche…  (!important  @demain, @lundi, @3/11)" aria-label="Nouvelle tâche">
  <input type="date" id="newTaskDate" title="Échéance (facultative)" aria-label="Échéance">
  <button type="submit" title="Ajouter la tâche">Ajouter</button>
</form>

<ul id="taskList" aria-label="Tâches"></ul>
<p id="emptyState" hidden><img class="i i32" src="../assets/icons/vide.png" alt="" width="32" height="32">Aucune tâche pour l'instant.</p>

<div class="status-line">
  <div id="status" class="offline"><span id="statusDot"></span><span id="statusLabel">hors ligne</span></div>
  <span class="grow"></span>
  <span class="hint">clic sur une tâche : modifier, dater, déplacer · Entrée : valider · Échap : annuler</span>
</div>

<input type="file" id="fileInput" accept=".txt" style="display:none">
</div>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const GIST_MARKER = 'outerovitch-todo-store-v1';
    const GIST_FILENAME = 'todo.txt';
    const LS_TOKEN = 'todoGhToken';
    const LS_GIST_ID = 'todoGistId';
    const LS_CACHE = 'todoLocalCache';
    const LS_DARK = 'todoDarkMode';
    const LS_MONO = 'todoMonospace';
    const LS_LAST_LIST = 'todoLastList';
    const LS_DIRTY = 'todoDirty';          // changements locaux pas encore envoyés au gist
    const LS_BASE = 'todoRemoteBase';      // dernier contenu connu du gist (détection des conflits)
    const DEBOUNCE_MS = 2500;
    const DUE_VIEW = '__due__';            // pseudo-liste « Échéances » (jamais sérialisée)
    const RECOMMENDED_LISTS = ['Boîte de réception', 'Messages', 'Ordi', 'Enfants & santé', 'Cours', 'Maison & général', 'Projets'];

    const listSelect = document.getElementById('listSelect');
    const addListBtn = document.getElementById('addListBtn');
    const renameListBtn = document.getElementById('renameListBtn');
    const deleteListBtn = document.getElementById('deleteListBtn');
    const setupListsBtn = document.getElementById('setupListsBtn');
    const dueBanner = document.getElementById('dueBanner');
    const dueBannerText = document.getElementById('dueBannerText');
    const conflictBar = document.getElementById('conflictBar');
    const conflictKeepBtn = document.getElementById('conflictKeepBtn');
    const conflictTakeBtn = document.getElementById('conflictTakeBtn');
    const newTaskForm = document.getElementById('newTaskForm');
    const newTaskInput = document.getElementById('newTaskInput');
    const newTaskDate = document.getElementById('newTaskDate');
    const taskListEl = document.getElementById('taskList');
    const emptyStateEl = document.getElementById('emptyState');
    const clearBtn = document.getElementById('clearBtn');
    const openBtn = document.getElementById('openBtn');
    const exportBtn = document.getElementById('exportBtn');
    const fileInput = document.getElementById('fileInput');
    const decreaseFontBtn = document.getElementById('decreaseFontBtn');
    const increaseFontBtn = document.getElementById('increaseFontBtn');
    const fontSpaceBtn = document.getElementById('fontSpaceBtn');
    const darkModeToggle = document.getElementById('darkModeToggle');
    const reloadBtn = document.getElementById('reloadBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const settingsCloseBtn = document.getElementById('settingsCloseBtn');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const tokenInput = document.getElementById('tokenInput');
    const tokenSaveBtn = document.getElementById('tokenSaveBtn');
    const tokenClearBtn = document.getElementById('tokenClearBtn');
    const gistLink = document.getElementById('gistLink');
    const settingsError = document.getElementById('settingsError');
    const statusEl = document.getElementById('status');
    const statusLabel = document.getElementById('statusLabel');

    let ghToken = localStorage.getItem(LS_TOKEN) || '';

    /* ---------- modèle de données : plusieurs listes, sérialisation façon org-mode ----------
       Une tâche : - [ ] [#A] texte DEADLINE: <2026-11-03>
       [#A] (important) et DEADLINE (échéance) sont facultatifs ; une ancienne version de la
       page les garde simplement dans le texte. */
    let state = { lists: [], currentListId: null, dueView: false };
    let uidCounter = 0;
    function genId() { uidCounter++; return 'id' + uidCounter + Math.random().toString(36).slice(2, 8); }

    function sanitizeInlineText(v) { return (v || '').replace(/[\r\n]+/g, ' ').trim(); }

    function parseTaskText(raw) {
      let text = sanitizeInlineText(raw), prio = false, deadline = null;
      const p = /^\[#A\]\s*/.exec(text);
      if (p) { prio = true; text = text.slice(p[0].length); }
      const d = /\s*DEADLINE:\s*<(\d{4}-\d{2}-\d{2})[^>]*>$/.exec(text);
      if (d) { deadline = d[1]; text = text.slice(0, d.index); }
      return { text: text.trim(), prio, deadline };
    }

    function formatTaskText(t) {
      return (t.prio ? '[#A] ' : '') + t.text + (t.deadline ? ' DEADLINE: <' + t.deadline + '>' : '');
    }

    // À faire avant fait ; parmi les tâches à faire : importantes, puis par échéance ; sinon ordre conservé.
    function compareTasks(a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (a.done) return 0;
      if (a.prio !== b.prio) return a.prio ? -1 : 1;
      if (a.deadline !== b.deadline) {
        if (!a.deadline) return 1;
        if (!b.deadline) return -1;
        return a.deadline < b.deadline ? -1 : 1;
      }
      return 0;
    }
    function sortTasks(list) { list.tasks.sort(compareTasks); }

    /* ---------- dates (AAAA-MM-JJ, heure locale) ---------- */
    const WEEKDAYS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
    function today() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
    function isoDate(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function parseIso(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
    function daysUntil(iso) { return Math.round((parseIso(iso) - today()) / 86400000); }

    function dueInfo(iso) {
      const n = daysUntil(iso);
      const d = parseIso(iso);
      let label;
      if (n < 0) label = 'en retard ' + (-n) + ' j';
      else if (n === 0) label = "aujourd'hui";
      else if (n === 1) label = 'demain';
      else if (n < 7) label = d.toLocaleDateString('fr-FR', { weekday: 'long' });
      else label = d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short',
        year: d.getFullYear() === today().getFullYear() ? undefined : 'numeric' });
      const cls = n < 0 ? 'late' : n === 0 ? 'today' : n <= 2 ? 'soon' : '';
      return { n, label, cls };
    }

    // « demain », « lundi » / « lun », « 3/11 », « 3/11/27 » → AAAA-MM-JJ (toujours dans le futur)
    function parseQuickDate(word) {
      const w = word.toLowerCase();
      const d = today();
      if (w === "aujourd'hui" || w === 'auj') return isoDate(d);
      if (w === 'demain') { d.setDate(d.getDate() + 1); return isoDate(d); }
      if (w.length >= 3) {
        const wd = WEEKDAYS.findIndex(name => name.startsWith(w));
        if (wd >= 0) { d.setDate(d.getDate() + ((wd - d.getDay() + 6) % 7) + 1); return isoDate(d); }
      }
      const m = /^(\d{1,2})\/(\d{1,2})(?:\/(\d{2}|\d{4}))?$/.exec(w);
      if (m) {
        const year = m[3] ? (m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3])) : d.getFullYear();
        const res = new Date(year, Number(m[2]) - 1, Number(m[1]));
        if (res.getDate() !== Number(m[1])) return null;          // 31/02 etc.
        if (!m[3] && res < d) res.setFullYear(year + 1);
        return isoDate(res);
      }
      return null;
    }

    function parseSerialized(text) {
      const lists = [];
      let current = null;
      const lines = (text || '').split(/\r\n|\r|\n/);
      for (const rawLine of lines) {
        const line = rawLine.trimEnd();
        const listMatch = /^\*\s+(.*)$/.exec(line);
        if (listMatch) {
          current = { id: genId(), name: sanitizeInlineText(listMatch[1]) || 'Sans titre', tasks: [] };
          lists.push(current);
          continue;
        }
        const taskMatch = /^-\s*\[([ xX])\]\s*(.*)$/.exec(line);
        if (taskMatch) {
          if (!current) {
            current = { id: genId(), name: 'Sans titre', tasks: [] };
            lists.push(current);
          }
          current.tasks.push({ id: genId(), ...parseTaskText(taskMatch[2]), done: taskMatch[1].toLowerCase() === 'x' });
        }
        // toute autre ligne (vide, mal formée) est ignorée silencieusement
      }
      lists.forEach(sortTasks);
      return lists;
    }

    function serializeLists(lists) {
      return lists.map(list => {
        const header = '* ' + (list.name || 'Sans titre');
        const tasks = list.tasks.map(t => '- [' + (t.done ? 'X' : ' ') + '] ' + formatTaskText(t)).join('\n');
        return tasks ? header + '\n' + tasks : header;
      }).join('\n\n') + '\n';
    }

    function ensureAtLeastOneList() {
      if (state.lists.length === 0) {
        state.lists.push({ id: genId(), name: 'Sans titre', tasks: [] });
      }
      if (!state.lists.find(l => l.id === state.currentListId)) {
        state.currentListId = state.lists[0].id;
      }
    }

    function getCurrentList() { return state.lists.find(l => l.id === state.currentListId); }

    function findTask(id) {
      for (const list of state.lists) {
        const task = list.tasks.find(t => t.id === id);
        if (task) return { list, task };
      }
      return null;
    }

    function rememberCurrentView() {
      const current = getCurrentList();
      if (state.dueView) localStorage.setItem(LS_LAST_LIST, DUE_VIEW);
      else if (current) localStorage.setItem(LS_LAST_LIST, current.name);
    }

    function loadStateFromText(text) {
      state.lists = parseSerialized(text);
      const lastName = localStorage.getItem(LS_LAST_LIST);
      const match = lastName ? state.lists.find(l => l.name === lastName) : null;
      state.currentListId = match ? match.id : (state.lists[0] ? state.lists[0].id : null);
      state.dueView = lastName === DUE_VIEW;
      ensureAtLeastOneList();
    }

    // Tâches à faire avec échéance, toutes listes confondues, de la plus proche à la plus lointaine.
    function dueTasks() {
      const out = [];
      state.lists.forEach(list => list.tasks.forEach(task => {
        if (!task.done && task.deadline) out.push({ list, task });
      }));
      return out.sort((a, b) => (a.task.deadline < b.task.deadline ? -1 : a.task.deadline > b.task.deadline ? 1 : 0));
    }

    /* ---------- rendu ---------- */
    function renderListSelect() {
      listSelect.innerHTML = '';
      const dueOpt = document.createElement('option');
      dueOpt.value = DUE_VIEW;
      const nDue = dueTasks().length;
      dueOpt.textContent = '⏰ Échéances' + (nDue ? ' (' + nDue + ')' : '');
      dueOpt.selected = state.dueView;
      listSelect.appendChild(dueOpt);
      state.lists.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.id;
        const open = l.tasks.filter(t => !t.done).length;
        opt.textContent = l.name + (open ? ' (' + open + ')' : '');
        if (!state.dueView && l.id === state.currentListId) opt.selected = true;
        listSelect.appendChild(opt);
      });
    }

    // listName : affiché dans la vue Échéances, où les tâches viennent de plusieurs listes.
    function buildTaskRow(task, listName) {
      const li = document.createElement('li');
      li.className = 'task-item' + (task.done ? ' done' : '');
      li.dataset.id = task.id;

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'task-checkbox';
      checkbox.checked = task.done;
      checkbox.setAttribute('aria-label', task.done ? 'Marquer comme à faire' : 'Marquer comme fait');
      checkbox.addEventListener('change', () => toggleTask(task.id));

      const textSpan = document.createElement('span');
      textSpan.className = 'task-text';
      textSpan.textContent = task.text;
      textSpan.tabIndex = 0;
      textSpan.setAttribute('role', 'button');
      textSpan.title = 'Cliquer pour modifier';
      const startEdit = () => editTaskInline(task.id, li);
      textSpan.addEventListener('click', startEdit);
      textSpan.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); startEdit(); } });

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'task-delete';
      delBtn.setAttribute('aria-label', 'Supprimer la tâche');
      delBtn.title = 'Supprimer';
      const delIcon = document.createElement('img');
      delIcon.className = 'i i16'; delIcon.src = '../assets/icons/erreur.png'; delIcon.alt = '';
      delIcon.width = delIcon.height = 16;
      delBtn.appendChild(delIcon);
      delBtn.addEventListener('click', () => deleteTask(task.id));

      li.appendChild(checkbox);
      if (task.prio) {
        const prio = document.createElement('span');
        prio.className = 'task-prio';
        prio.textContent = '!';
        prio.title = 'Important';
        li.appendChild(prio);
      }
      li.appendChild(textSpan);
      if (task.deadline) {
        const info = dueInfo(task.deadline);
        const due = document.createElement('span');
        due.className = 'due ' + info.cls;
        due.textContent = info.label;
        due.title = 'Échéance : ' + parseIso(task.deadline).toLocaleDateString('fr-FR', { dateStyle: 'full' });
        li.appendChild(due);
      }
      if (listName) {
        const ln = document.createElement('span');
        ln.className = 'task-list-name';
        ln.textContent = listName;
        li.appendChild(ln);
      }
      li.appendChild(delBtn);
      return li;
    }

    // Édition sur place : texte, échéance, importance et liste (déplacer = trier la boîte de réception).
    function editTaskInline(taskId, li) {
      const found = findTask(taskId);
      if (!found) return;
      const { task } = found;

      const row = document.createElement('div');
      row.className = 'task-edit-row';
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'task-edit-input';
      input.value = task.text;
      input.setAttribute('aria-label', 'Texte de la tâche');
      const dateInput = document.createElement('input');
      dateInput.type = 'date';
      dateInput.value = task.deadline || '';
      dateInput.title = 'Échéance (vider pour la retirer)';
      dateInput.setAttribute('aria-label', 'Échéance');
      const prioLabel = document.createElement('label');
      const prioCb = document.createElement('input');
      prioCb.type = 'checkbox';
      prioCb.checked = task.prio;
      prioLabel.append(prioCb, 'important');
      const listSel = document.createElement('select');
      listSel.title = 'Déplacer vers une autre liste';
      listSel.setAttribute('aria-label', 'Liste');
      state.lists.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.id;
        opt.textContent = l.name;
        opt.selected = l === found.list;
        listSel.appendChild(opt);
      });
      const okBtn = document.createElement('button');
      okBtn.type = 'button';
      okBtn.textContent = 'OK';
      row.append(input, dateInput, prioLabel, listSel, okBtn);

      li.querySelector('.task-text').replaceWith(row);
      li.querySelectorAll('.task-prio,.task-list-name,.due').forEach(el => el.remove());
      input.focus();
      input.select();

      let done = false;
      function commit() {
        if (done) return;
        done = true;
        const val = sanitizeInlineText(input.value);
        if (val) task.text = val;
        task.deadline = dateInput.value || null;
        task.prio = prioCb.checked;
        const target = state.lists.find(l => l.id === listSel.value);
        if (target && target !== found.list) {
          found.list.tasks = found.list.tasks.filter(t => t !== task);
          target.tasks.unshift(task);
          sortTasks(target);
        }
        sortTasks(found.list);
        mutateState();
      }
      function cancel() {
        if (done) return;
        done = true;
        render();
      }
      row.addEventListener('keydown', e => {
        if (e.key === 'Enter' && e.target !== okBtn) { e.preventDefault(); commit(); }
        else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
      });
      okBtn.addEventListener('click', commit);
      // Valider quand le focus quitte la ligne (pas quand il passe du texte à la date, etc.).
      row.addEventListener('focusout', () => {
        setTimeout(() => { if (!row.contains(document.activeElement)) commit(); }, 0);
      });
    }

    function isEditing() { return !!taskListEl.querySelector('.task-edit-row'); }

    function showTaskList(empty, emptyText) {
      taskListEl.hidden = empty;
      emptyStateEl.hidden = !empty;
      emptyStateEl.lastChild.textContent = emptyText;
    }

    function renderTaskList() {
      taskListEl.innerHTML = '';
      if (state.dueView) { renderDueView(); return; }
      const list = getCurrentList();
      if (!list || list.tasks.length === 0) { showTaskList(true, "Aucune tâche pour l'instant."); return; }
      showTaskList(false);
      list.tasks.forEach(task => taskListEl.appendChild(buildTaskRow(task)));
    }

    function renderDueView() {
      const items = dueTasks();
      if (items.length === 0) { showTaskList(true, 'Aucune échéance. Tranquille.'); return; }
      showTaskList(false);
      const groups = [['En retard', n => n < 0], ["Aujourd'hui", n => n === 0],
        ['7 prochains jours', n => n > 0 && n <= 7], ['Plus tard', n => n > 7]];
      groups.forEach(([title, test]) => {
        const inGroup = items.filter(it => test(daysUntil(it.task.deadline)));
        if (!inGroup.length) return;
        const head = document.createElement('li');
        head.className = 'group-head';
        head.textContent = title + ' (' + inGroup.length + ')';
        taskListEl.appendChild(head);
        inGroup.forEach(it => taskListEl.appendChild(buildTaskRow(it.task, it.list.name)));
      });
    }

    // Bandeau « 2 en retard · 1 aujourd'hui », titre de l'onglet et pastille de l'appli installée.
    function renderDueSummary() {
      let late = 0, now = 0, soon = 0;
      dueTasks().forEach(({ task }) => {
        const n = daysUntil(task.deadline);
        if (n < 0) late++; else if (n === 0) now++; else if (n <= 2) soon++;
      });
      const parts = [];
      if (late) parts.push(late + ' en retard');
      if (now) parts.push(now + " aujourd'hui");
      if (soon) parts.push(soon + ' dans les 2 jours');
      dueBannerText.textContent = parts.join(' · ');
      dueBanner.hidden = !parts.length || state.dueView;
      const urgent = late + now;
      document.title = urgent ? '(' + urgent + ') Todo' : 'Todo';
      if (navigator.setAppBadge) {
        (urgent ? navigator.setAppBadge(urgent) : navigator.clearAppBadge()).catch(() => {});
      }
    }

    function renderToolbarState() {
      newTaskForm.hidden = state.dueView;
      renameListBtn.hidden = deleteListBtn.hidden = state.dueView;
      clearBtn.disabled = state.dueView;
      setupListsBtn.hidden = RECOMMENDED_LISTS.some(name => state.lists.some(l => l.name === name));
    }

    function render() {
      const active = document.activeElement;
      let restoreId = null;
      if (active && active.classList && active.classList.contains('task-checkbox')) {
        const li = active.closest('li[data-id]');
        if (li) restoreId = li.dataset.id;
      }
      renderListSelect();
      renderToolbarState();
      renderTaskList();
      renderDueSummary();
      if (restoreId) {
        const li = taskListEl.querySelector('li[data-id="' + restoreId + '"]');
        const cb = li && li.querySelector('.task-checkbox');
        if (cb) cb.focus();
      }
    }

    /* ---------- mutations ---------- */
    function mutateState() {
      localStorage.setItem(LS_CACHE, serializeLists(state.lists));
      rememberCurrentView();
      markDirty();
      render();
    }

    function toggleTask(id) {
      const found = findTask(id);
      if (!found) return;
      found.task.done = !found.task.done;
      sortTasks(found.list);
      mutateState();
    }

    // Saisie rapide : « !texte » = important, « texte @demain » (ou @lundi, @3/11) = échéance.
    // Le champ date, s'il est rempli, l'emporte.
    function addTask(rawText, dateValue) {
      const task = parseTaskText(rawText);
      if (/^!\s*/.test(task.text)) { task.prio = true; task.text = task.text.replace(/^!\s*/, ''); }
      const at = /\s*@(\S+)$/.exec(task.text);
      const quick = at && parseQuickDate(at[1]);
      if (quick) { task.deadline = quick; task.text = task.text.slice(0, at.index); }
      if (dateValue) task.deadline = dateValue;
      task.text = task.text.trim();
      if (!task.text) return;
      const list = getCurrentList();
      if (!list) return;
      list.tasks.unshift({ id: genId(), ...task, done: false });
      sortTasks(list);
      mutateState();
    }

    function deleteTask(id) {
      const found = findTask(id);
      if (!found) return;
      found.list.tasks = found.list.tasks.filter(t => t !== found.task);
      mutateState();
    }

    function createRecommendedLists() {
      RECOMMENDED_LISTS.forEach(name => {
        if (!state.lists.some(l => l.name === name)) state.lists.push({ id: genId(), name, tasks: [] });
      });
      // La liste par défaut « Sans titre » vide créée au premier lancement ne sert plus.
      state.lists = state.lists.filter(l => l.name !== 'Sans titre' || l.tasks.length);
      state.currentListId = state.lists.find(l => l.name === RECOMMENDED_LISTS[0]).id;
      state.dueView = false;
      mutateState();
    }

    function addList() {
      const name = prompt('Nom de la nouvelle liste :');
      if (name === null) return;
      const trimmed = sanitizeInlineText(name);
      if (!trimmed) return;
      const list = { id: genId(), name: trimmed, tasks: [] };
      state.lists.push(list);
      state.currentListId = list.id;
      state.dueView = false;
      mutateState();
    }

    function renameCurrentList() {
      const list = getCurrentList();
      if (!list) return;
      const name = prompt('Renommer la liste :', list.name);
      if (name === null) return;
      const trimmed = sanitizeInlineText(name);
      if (!trimmed) return;
      list.name = trimmed;
      mutateState();
    }

    function deleteCurrentList() {
      const list = getCurrentList();
      if (!list) return;
      if (!confirm('Supprimer la liste « ' + list.name + ' » et toutes ses tâches ?')) return;
      state.lists = state.lists.filter(l => l.id !== list.id);
      ensureAtLeastOneList();
      mutateState();
    }

    function showDueView() {
      state.dueView = true;
      rememberCurrentView();
      render();
    }

    listSelect.addEventListener('change', () => {
      if (listSelect.value === DUE_VIEW) { showDueView(); return; }
      const list = state.lists.find(l => l.id === listSelect.value);
      if (!list) return;
      state.currentListId = list.id;
      state.dueView = false;
      rememberCurrentView();
      render();
    });
    dueBanner.addEventListener('click', showDueView);
    dueBanner.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showDueView(); } });
    setupListsBtn.addEventListener('click', createRecommendedLists);
    addListBtn.addEventListener('click', addList);
    renameListBtn.addEventListener('click', renameCurrentList);
    deleteListBtn.addEventListener('click', deleteCurrentList);

    newTaskForm.addEventListener('submit', e => {
      e.preventDefault();
      addTask(newTaskInput.value, newTaskDate.value);
      newTaskInput.value = '';
      newTaskDate.value = '';
      newTaskInput.focus();
    });

    /* ---------- préférences d'affichage ---------- */
    let isMonospace = localStorage.getItem(LS_MONO) === 'true';
    if (isMonospace) {
      document.body.classList.add('monospace-mode');
      fontSpaceBtn.textContent = 'M/P';
    } else {
      fontSpaceBtn.textContent = 'P/M';
    }
    fontSpaceBtn.addEventListener('click', () => {
      isMonospace = !isMonospace;
      document.body.classList.toggle('monospace-mode', isMonospace);
      fontSpaceBtn.textContent = isMonospace ? 'M/P' : 'P/M';
      localStorage.setItem(LS_MONO, isMonospace);
    });

    let currentFontSize = 18;
    function updateFontSize() { document.documentElement.style.setProperty('--content-font-size', currentFontSize + 'px'); }
    decreaseFontBtn.addEventListener('click', () => { if (currentFontSize > 12) { currentFontSize -= 2; updateFontSize(); } });
    increaseFontBtn.addEventListener('click', () => { if (currentFontSize < 80) { currentFontSize += 2; updateFontSize(); } });
    updateFontSize();

    function setDarkMode(on) {
      document.body.classList.toggle('dark-mode', on);
      localStorage.setItem(LS_DARK, on ? 'true' : 'false');
    }
    darkModeToggle.addEventListener('click', () => setDarkMode(!document.body.classList.contains('dark-mode')));
    if (localStorage.getItem(LS_DARK) === 'true') setDarkMode(true);

    /* ---------- import / export manuels (secours, indépendants du gist) ---------- */
    clearBtn.addEventListener('click', () => {
      const list = getCurrentList();
      if (!list || list.tasks.length === 0) return;
      if (confirm('Vider la liste « ' + list.name + ' » ? Cette action sera aussi synchronisée.')) {
        list.tasks = [];
        mutateState();
      }
    });
    openBtn.addEventListener('click', () => { fileInput.value = ''; fileInput.click(); });
    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { loadStateFromText(reader.result); mutateState(); };
      reader.readAsText(file);
    });
    exportBtn.addEventListener('click', () => {
      const blob = new Blob([serializeLists(state.lists)], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'todo.txt';
      document.body.appendChild(a); a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
    });

    /* ---------- statut de synchro ---------- */
    function setStatus(statusState, message) {
      statusEl.className = statusState;
      const labels = { synced: 'synchronisé', pending: 'modifié', saving: 'sauvegarde…', error: 'erreur', offline: 'hors ligne', loading: 'chargement…' };
      statusLabel.textContent = message || labels[statusState] || statusState;
      statusEl.title = message || '';
    }

    /* ---------- API GitHub (gist) ---------- */
    async function ghFetch(path, opts = {}) {
      const res = await fetch('https://api.github.com' + path, {
        ...opts,
        headers: {
          'Authorization': 'token ' + ghToken,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json',
          ...(opts.headers || {})
        }
      });
      if (!res.ok) {
        let detail = '';
        try {
          const body = await res.json();
          detail = body.message || '';
          if (Array.isArray(body.errors) && body.errors.length) {
            detail += ' (' + body.errors.map(e => e.message || e.code || JSON.stringify(e)).join(', ') + ')';
          }
        } catch (e) {}
        throw new Error('GitHub API ' + res.status + (detail ? ' : ' + detail : ''));
      }
      return res.status === 204 ? null : res.json();
    }

    async function resolveGistId() {
      let id = localStorage.getItem(LS_GIST_ID);
      if (id) return id;
      for (let page = 1; page <= 5; page++) {
        const gists = await ghFetch('/gists?per_page=100&page=' + page);
        const found = gists.find(g => g.description === GIST_MARKER);
        if (found) { localStorage.setItem(LS_GIST_ID, found.id); return found.id; }
        if (gists.length < 100) break;
      }
      const created = await ghFetch('/gists', {
        method: 'POST',
        body: JSON.stringify({
          description: GIST_MARKER,
          public: false,
          files: { [GIST_FILENAME]: { content: serializeLists(state.lists) || '\n' } }
        })
      });
      localStorage.setItem(LS_GIST_ID, created.id);
      return created.id;
    }

    function showGistLink(id) {
      gistLink.innerHTML = 'Gist : <a href="https://gist.github.com/' + id + '" target="_blank" rel="noopener noreferrer">' + id + '</a>';
    }

    // Le contenu du gist, tel quel ('' si vide).
    async function fetchRemote() {
      const id = await resolveGistId();
      showGistLink(id);
      const gist = await ghFetch('/gists/' + id);
      const file = gist.files[GIST_FILENAME];
      const content = file ? file.content : '';
      return content === '\n' ? '' : content;
    }

    function sameContent(a, b) {
      const norm = t => (t || '').replace(/[ \t]+$/gm, '').trim();
      return norm(a) === norm(b);
    }

    // Dernier contenu du gist vu par cet appareil : s'il a changé au moment d'envoyer,
    // c'est qu'un autre appareil a écrit entre-temps (conflit).
    let lastRemote = localStorage.getItem(LS_BASE);
    function setBase(content) {
      lastRemote = content;
      if (content === null) localStorage.removeItem(LS_BASE);
      else localStorage.setItem(LS_BASE, content);
    }

    async function loadFromGist() {
      setStatus('loading');
      const gen = editGen;
      const content = await fetchRemote();
      // Modifié (ou envoi en cours) pendant le chargement : ne pas écraser, l'envoi s'en charge.
      if (dirty || syncing || gen !== editGen) { if (!syncing) setStatus('pending'); return; }
      loadStateFromText(content);
      setBase(content);
      localStorage.setItem(LS_CACHE, serializeLists(state.lists));
      render();
      setStatus('synced');
    }

    async function syncToGist() {
      setStatus('saving');
      const remote = await fetchRemote();
      const content = serializeLists(state.lists);
      // Base inconnue (jamais chargé sur cet appareil) : tout gist non vide et différent est un conflit.
      const changedElsewhere = lastRemote === null ? remote.trim() !== '' : !sameContent(remote, lastRemote);
      if (changedElsewhere && !sameContent(remote, content)) {
        showConflict(remote);
        return;
      }
      await ghFetch('/gists/' + localStorage.getItem(LS_GIST_ID), {
        method: 'PATCH',
        body: JSON.stringify({ files: { [GIST_FILENAME]: { content: content || '\n' } } })
      });
      setBase(content);
      setStatus(dirty ? 'pending' : 'synced');
    }

    /* ---------- conflit : deux appareils ont modifié la todo ---------- */
    let conflictRemote = null;
    function showConflict(remote) {
      conflictRemote = remote;
      setDirty(true);
      conflictBar.hidden = false;
      setStatus('error', 'conflit : modifiée sur un autre appareil');
    }
    function closeConflict() {
      conflictRemote = null;
      conflictBar.hidden = true;
    }
    conflictKeepBtn.addEventListener('click', () => {
      setBase(conflictRemote);
      closeConflict();
      flushSync();
    });
    conflictTakeBtn.addEventListener('click', () => {
      closeConflict();
      setDirty(false);
      loadFromGist().catch(err => { console.error(err); setStatus('error', err.message); });
    });

    /* ---------- envoi différé ----------
       dirty est aussi gardé dans le localStorage : des changements faits hors ligne
       (téléphone sans réseau, onglet fermé avant l'envoi) partent au prochain lancement. */
    let dirty = localStorage.getItem(LS_DIRTY) === '1';
    let syncing = false;
    let editGen = 0;                       // compte les modifications locales
    let debounceTimer = null;
    function setDirty(v) {
      dirty = v;
      if (v) localStorage.setItem(LS_DIRTY, '1');
      else localStorage.removeItem(LS_DIRTY);
    }
    function scheduleSync() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(flushSync, DEBOUNCE_MS);
    }
    function markDirty() {
      editGen++;
      setDirty(true);
      if (conflictRemote !== null) return;
      setStatus(ghToken ? 'pending' : 'offline');
      if (ghToken) scheduleSync();
    }

    function flushSync() {
      clearTimeout(debounceTimer);
      if (!ghToken || !dirty || syncing || conflictRemote !== null) return;
      syncing = true;
      setDirty(false);
      let failed = false;
      syncToGist()
        .catch(err => { console.error(err); failed = true; setDirty(true); setStatus('error', err.message); })
        .finally(() => {
          syncing = false;
          // modifié pendant l'envoi : renvoyer (mais pas en boucle si le réseau est coupé)
          if (dirty && !failed && conflictRemote === null) scheduleSync();
        });
    }

    // Filet de sécurité en plus du debounce : sauvegarde garantie quand
    // l'onglet passe en arrière-plan/se ferme (visibilitychange est le signal
    // fiable ; pagehide/beforeunload en secours). Au retour au premier plan,
    // on recharge le gist : un autre appareil l'a peut-être modifié.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') { flushSync(); return; }
      if (isEditing()) return;
      render();   // « aujourd'hui », « demain »… peuvent avoir changé depuis la veille
      if (!ghToken || syncing || conflictRemote !== null) return;
      if (dirty) flushSync();
      else loadFromGist().catch(err => { console.error(err); setStatus('error', err.message); });
    });
    window.addEventListener('pagehide', flushSync);
    window.addEventListener('beforeunload', flushSync);
    window.addEventListener('online', flushSync);

    reloadBtn.addEventListener('click', () => {
      if (!ghToken) { openSettings(); return; }
      if (dirty && !confirm('Des changements de cet appareil ne sont pas encore envoyés. Les abandonner et recharger ?')) return;
      closeConflict();
      setDirty(false);
      loadFromGist().catch(err => { console.error(err); setStatus('error', err.message); });
    });

    /* ---------- panneau de connexion ---------- */
    function openSettings() {
      tokenInput.value = ghToken || '';
      settingsError.style.display = 'none';
      if (localStorage.getItem(LS_GIST_ID)) showGistLink(localStorage.getItem(LS_GIST_ID));
      else gistLink.textContent = '';
      settingsModal.style.display = 'block';
      modalBackdrop.style.display = 'block';
    }
    function closeSettings() {
      settingsModal.style.display = 'none';
      modalBackdrop.style.display = 'none';
    }
    settingsBtn.addEventListener('click', openSettings);
    settingsCloseBtn.addEventListener('click', closeSettings);
    modalBackdrop.addEventListener('click', closeSettings);

    tokenSaveBtn.addEventListener('click', async () => {
      const val = tokenInput.value.trim();
      if (!val) { settingsError.textContent = 'Colle un token.'; settingsError.style.display = 'block'; return; }
      ghToken = val;
      localStorage.setItem(LS_TOKEN, ghToken);
      settingsError.style.display = 'none';
      try {
        closeConflict();
        setDirty(false);
        await loadFromGist();
        closeSettings();
      } catch (err) {
        console.error(err);
        settingsError.textContent = 'Échec de connexion : ' + err.message;
        settingsError.style.display = 'block';
      }
    });

    tokenClearBtn.addEventListener('click', () => {
      ghToken = '';
      localStorage.removeItem(LS_TOKEN);
      localStorage.removeItem(LS_GIST_ID);
      setBase(null);
      closeConflict();
      tokenInput.value = '';
      gistLink.textContent = '';
      setStatus('offline');
    });

    /* ---------- démarrage ---------- */
    loadStateFromText(localStorage.getItem(LS_CACHE) || '');
    render();

    if (!ghToken) setStatus('offline');
    else if (dirty) flushSync();
    else loadFromGist().catch(err => { console.error(err); setStatus('error', err.message); });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(err => console.error(err));
  });
  </script>
</body>
</html>
